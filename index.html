:root{--bg:#ECEFF4; --card:#FFFFFF; --ink:#1B2433; --muted:#5B6678; --line:#CBD2DE;
  --hi:#FFD24A; --hi-ink:#1B2433; --primary:#7B1E3A; --primary-ink:#FFFFFF;
  --prefix:#F4AFBF; --suffix:#A3BEEA; --latin:#C9B5F0; --greek:#A9DDB5; --list:#E9B9C6; --gold:#F7D990;
  --good:#1E8A4C; --good-bg:#E2F5E9; --bad:#C2372E; --bad-bg:#FCE7E5;
  --paper:#F4F5EE; --paper-ink:#3A3D44; --rule:#A7A9AB;
  --display:"URW Gothic", "Century Gothic", CenturyGothic, "Avenir Next", sans-serif;
  --body:"URW Gothic", "Century Gothic", CenturyGothic, "Avenir Next", sans-serif;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#262B35; --paper-ink:#E6E8EC; --rule:#5D636E; --bg:#12161F; --card:#1C2230; --ink:#E7EBF2; --muted:#9AA4B6; --line:#2F3747;
  --hi:#E8B730; --hi-ink:#12161F; --primary:#E89AAF; --primary-ink:#1C0E14;
  --prefix:#7A3B50; --suffix:#2E4C80; --latin:#563F88; --greek:#2D6141; --list:#6A2340; --gold:#6B5523;
  --good:#5FD38F; --good-bg:#16352A; --bad:#FF8A80; --bad-bg:#3A1E1D; color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#262B35; --paper-ink:#E6E8EC; --rule:#5D636E; --bg:#12161F; --card:#1C2230; --ink:#E7EBF2; --muted:#9AA4B6; --line:#2F3747;
  --hi:#E8B730; --hi-ink:#12161F; --primary:#E89AAF; --primary-ink:#1C0E14;
  --prefix:#7A3B50; --suffix:#2E4C80; --latin:#563F88; --greek:#2D6141; --list:#6A2340; --gold:#6B5523;
  --good:#5FD38F; --good-bg:#16352A; --bad:#FF8A80; --bad-bg:#3A1E1D; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
header > div{min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1;margin:0;text-wrap:balance}
.titlebtn{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.titlebtn:focus-visible{outline:3px solid var(--primary);outline-offset:4px;border-radius:6px}
h1 mark{background:linear-gradient(transparent 55%, var(--hi) 55%);color:inherit;padding:0 2px}
h2{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;margin:0}
.sub{color:var(--muted);margin:0;font-size:.98rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
*{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid currentColor;outline-offset:-6px}
.linkish:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:4px}
input:focus-visible{outline:3px solid var(--primary);outline-offset:-3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink)}
.modetabs{flex:1 1 100%;min-width:0;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;position:relative;gap:2px;border-radius:18px;padding:5px;scroll-padding-inline:8px}
.modetabs::-webkit-scrollbar{display:none}
@media (hover:none) and (pointer:coarse) and (max-width:700px){
  #tabWrap{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  #tabWrap .modetabs{border:0;border-radius:0;background:transparent;padding:2px}
  #tabWrap .modetabs button{min-width:66px;min-height:56px;padding:6px 6px 5px;font-size:.72rem;border-radius:12px;gap:3px}
  #tabWrap .modetabs .ti{width:24px;height:24px}
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  body .btoast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.typing #tabWrap{display:none}
  body.typing{padding-bottom:0}
}
.tabwrap{position:relative;flex:1 1 100%;min-width:0;display:flex}
.tabwrap .modetabs{flex:1 1 auto}
.tabarrow{display:none;position:absolute;top:50%;z-index:2;width:36px;height:36px;margin-top:-18px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.15);place-items:center;padding:0;cursor:pointer}
.tabarrow svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tabarrow:hover{border-color:var(--primary);color:var(--primary)}
.tabarrow.l{left:-8px}
.tabarrow.r{right:-8px}
@media (hover:hover) and (pointer:fine){
  .tabwrap.cl .tabarrow.l,.tabwrap.cr .tabarrow.r{display:grid}
}
@media (hover:hover) and (pointer:fine) and (min-width:560px){
  .modetabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible;-webkit-mask-image:none!important;mask-image:none!important;gap:4px}
  .modetabs button{min-width:0;white-space:normal;text-align:center;padding:8px 4px 7px;font-size:.82rem}
  .tabwrap .tabarrow{display:none!important}
}
.modetabs.fl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.modetabs.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.modetabs.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.modetabs button{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:74px;min-height:64px;padding:8px 10px 7px;border-radius:13px;font-size:.8rem;font-weight:700;line-height:1.1;white-space:nowrap;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.modetabs button:hover{color:var(--ink);background:var(--bg)}
.modetabs button:active{transform:scale(.95)}
.modetabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink)}
.modetabs button:focus-visible{outline-offset:-3px}
.ti{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modetabs button[aria-selected="true"] .ti{stroke-width:2.3}
#tab-home,.hgame[data-go="home"]{--ic:#A3304F}
#tab-cards,.hgame[data-go="cards"]{--ic:#D6336C}
#tab-review,.hgame[data-go="review"]{--ic:#E8590C}
#tab-quiz,.hgame[data-go="quiz"]{--ic:#7048E8}
.hgame[data-go="parts"]{--ic:#0C8599}
#tab-build,.hgame[data-go="build"]{--ic:#E67700}
#tab-match,.hgame[data-go="match"]{--ic:#2B8A3E}
#tab-memory,.hgame[data-go="memory"]{--ic:#C2255C}
#tab-spell,.hgame[data-go="spell"]{--ic:#1C7ED6}
#tab-sort,.hgame[data-go="sort"]{--ic:#6741D9}
#tab-speed,.hgame[data-go="speed"]{--ic:#F08C00}
.hgame[data-go="context"]{--ic:#0B7285}
#tab-plan,.hgame[data-go="plan"]{--ic:#2F9E44}
#tab-progress,.hgame[data-go="progress"]{--ic:#D9480F}
.ti .d{fill:currentColor;stroke:none;opacity:.22}
.ti .dot{fill:currentColor;stroke:none}
.modetabs button:not([aria-selected="true"]) .ti,.hgame .ti{color:var(--ic)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .modetabs button:not([aria-selected="true"]) .ti,:root:not([data-theme="light"]) .hgame .ti{color:color-mix(in srgb,var(--ic) 60%,#fff)}
}
:root[data-theme="dark"] .modetabs button:not([aria-selected="true"]) .ti,:root[data-theme="dark"] .hgame .ti{color:color-mix(in srgb,var(--ic) 60%,#fff)}

/* ===== Spelling Champion: additions on top of Root Detective's styles ===== */
:root{--c5:#F8C99B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c5:#7A4A22}}
:root[data-theme="dark"]{--c5:#7A4A22}
/* word kinds and vowel sounds take the card colours */
.c-list{--fc:var(--list)} .c-review{--fc:var(--greek)} .c-challenge{--fc:var(--gold)}
.s-a{--fc:var(--prefix)} .s-e{--fc:var(--suffix)} .s-i{--fc:var(--latin)} .s-o{--fc:var(--greek)} .s-u{--fc:var(--c5)}
.chip{background:color-mix(in srgb,var(--line) 55%,var(--card));color:var(--ink)}
.chip.c-list,.chip.c-review,.chip.c-challenge{background:var(--fc);color:var(--paper-ink)}
.chip small{font-weight:600;opacity:.8}
/* tab colours for the new modes */
#tab-rhyme,.hgame[data-go="rhyme"]{--ic:#0C8599}
#tab-abc,.hgame[data-go="abc"]{--ic:#5C940D}
#tab-proof,.hgame[data-go="proof"]{--ic:#0B7285}

.m-hand{fill:#FFD34D;stroke:#9A5B0A;stroke-width:2.5}
.m-stem{fill:url(#mGold);stroke:#9A5B0A;stroke-width:2.5;stroke-linejoin:round}
.m-knob{fill:#FFD95A;stroke:#9A5B0A;stroke-width:2.2}
.m-step{fill:#8A2443;stroke:#3D0D1E;stroke-width:2.5;stroke-linejoin:round}
.m-base{fill:url(#mBase);stroke:#3D0D1E;stroke-width:2.5}
.m-plate{fill:#FFD95A;stroke:#9A5B0A;stroke-width:1.2}
.m-brow{fill:none;stroke:#5A3507;stroke-width:2.6;stroke-linecap:round}
.m-eyes{fill:#2B1D0E}.m-shine{fill:#fff}
.m-mouth{fill:#7A2E12;stroke:#2B1D0E;stroke-width:2.4;stroke-linejoin:round}
.m-tongue{fill:#FF7F93}
.m-cheek{fill:#FF8FA3;opacity:.75}
.m-star{fill:#FFE066;stroke:#C98A0B;stroke-width:1.1;stroke-linejoin:round;transform-origin:60px 5px;animation:twinkle 2.4s ease-in-out infinite}
.m-spark{fill:#FFCF3A;transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
.m-spark.s1{animation-delay:-.8s}.m-spark.s2{animation-delay:-1.6s}
.m-pstar{fill:#C98A0B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .m-shadow{fill:#000;opacity:.35}:root:not([data-theme="light"]) .m-base,:root:not([data-theme="light"]) .m-step{stroke:#E89AAF}}
:root[data-theme="dark"] .m-shadow{fill:#000;opacity:.35}:root[data-theme="dark"] .m-base,:root[data-theme="dark"] .m-step{stroke:#E89AAF}
@keyframes twinkle{0%,100%{scale:.7;opacity:.55}50%{scale:1.1;opacity:1}}
@media (prefers-reduced-motion: reduce){.m-star,.m-spark{animation:none}}
html.calm .m-star,html.calm .m-spark{animation:none}

/* the longer title fits one line on phones */
@media (max-width:480px){h1{font-size:1.6rem}}
@media (max-width:360px){h1{font-size:1.4rem}}
/* Home */
.hnext.soon{border-style:dashed}
.hweek{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.wbox{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:520px){.wbox{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:360px){.wbox{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wchip{font:inherit;font-weight:700;font-size:1.02rem;color:var(--paper-ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 4px;min-height:40px;text-align:center;overflow-wrap:anywhere;box-shadow:0 2px 0 var(--line);transition:transform .1s}
.wchip:hover{border-color:var(--primary)}.wchip:active{transform:translateY(2px);box-shadow:none}
.wchip.speaking{animation:popIn .45s cubic-bezier(.3,1.6,.5,1)}
.wextra{display:flex;flex-wrap:wrap;gap:4px 16px}.wextra b{color:var(--ink);margin-right:4px}
.hprac{display:block}
.hgame .hgdots{display:flex;gap:3px;margin-top:-1px}
.hgdots i,.pdots i{display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);opacity:.8}
.hgdots i.on,.pdots i.on{background:var(--good);border-color:var(--good);opacity:1}
.pdots{display:inline-flex;gap:4px;vertical-align:middle}.pdots i{width:10px;height:10px}

/* Plan: Mon–Fri */
.routine .gtop h2{font-size:1.25rem}
.routine .days{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:620px){.routine .days{grid-template-columns:1fr 1fr}.routine .day:last-child{grid-column:1/-1}}
.routine .day{display:flex;flex-direction:column;gap:4px}
.ptask{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);background:none;border:0;border-radius:8px;padding:5px 4px;text-align:left;min-height:36px;cursor:pointer}
.ptask:hover:not(:disabled){background:var(--bg)}
.ptask:disabled{opacity:.55;cursor:default}
.ptask small{margin-left:auto;font-size:.7rem;color:var(--muted);font-weight:600}
.pcheck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:#fff;line-height:1}
.ptask.on .pcheck{background:var(--good);border-color:var(--good)}
.ptask.on>span:nth-child(2){color:var(--good)}
/* Plan: the weeks still to come */
.fogweeks{position:absolute;left:12px;right:12px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1.5px dashed var(--line);text-align:center}
.fogweeks p{margin:0;color:var(--muted)}.fogweeks p b{color:var(--ink)}
.fognums{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.fognums span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;color:var(--muted);background:var(--bg);border:1.5px solid var(--line)}
.wmap.simple .stage.soon{border-style:dashed!important;color:var(--muted)!important;border-color:var(--muted)!important}
.wmap.simple .stage.cur.soon{color:var(--primary-ink)!important;border-style:solid!important;border-color:#fff!important}

/* Flashcards: the back shows the spelling pattern, the sentence and the letters */
.heads em.pspell{font-style:normal;background:var(--fc);border-radius:6px;padding:0 6px}
.fcback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 4px 16px;text-align:center}
.fcmean{margin:0;font-size:clamp(1.1rem,4.2vw,1.35rem);font-weight:700;line-height:1.35;max-width:30ch;text-wrap:pretty}
.fclbl{display:block;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.fclang{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:34ch}
.fclang p{margin:0;padding:6px 12px 7px;border-radius:12px;background:color-mix(in srgb,var(--fc) 38%,transparent);font-size:1.08rem;line-height:1.35;text-wrap:pretty}
.fclang p .fclbl{display:inline;margin:0 7px 0 0;letter-spacing:.04em;font-size:.78rem;color:var(--ink);opacity:.7}
[lang="zh-Hans"]{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",var(--body)}
[lang="ko"]{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",var(--body)}
.fcsent{margin:0;font-size:clamp(1.15rem,4.4vw,1.5rem);line-height:1.45;max-width:30ch;text-wrap:pretty}
.fcsent mark{background:transparent;color:inherit;padding:0;text-decoration:underline;text-decoration-color:var(--fc);text-decoration-thickness:5px;text-underline-offset:4px}
.fcletters{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.fcletters span{min-width:1.7em;padding:2px 4px 4px;border-bottom:3px solid var(--rule);font-size:clamp(1.4rem,5.5vw,1.9rem);font-weight:700;line-height:1.1}
@media (max-width:700px){.fcback{gap:10px;padding:10px 2px 12px}}

/* answers and prompts */
.bigsay{flex:none;border:1.5px solid var(--primary);border-radius:999px;padding:10px 18px;display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:800;background:var(--primary);color:var(--primary-ink);min-height:48px;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--primary) 60%,#000);transition:transform .1s,box-shadow .1s}
.bigsay svg{width:24px;height:24px}
.bigsay:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.bigsay.speaking{animation:popIn .45s cubic-bezier(.3,1.6,.5,1)}
.spellask{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spword{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,10vw,3rem);letter-spacing:.04em;line-height:1.1}
.fb .sent{font-size:1.05rem}
.sent mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 2px}
.sent .blank{min-width:4.5em}
.opt.spopt{font-size:1.35rem;text-align:center;letter-spacing:.02em}
.opt.spopt.right,.opt.spopt.wrong{padding-right:44px;padding-left:44px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:460px){.opts.three{grid-template-columns:1fr}}
.freq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.freq li{display:flex;align-items:center;gap:10px}.freq li .linkish{min-width:7.5em;text-align:left}.freq li.ok .linkish{color:var(--good)}
.passline{margin:0;font-weight:700;color:var(--muted)}.passline.ok{color:var(--good)}
.score small{font-size:.5em;color:var(--muted)}
/* Build it: one box per letter, all the same size (--t, set from the space there is). The word sits on one line,
   or breaks between syllables when it can't fit; the letter tray breaks into the same number of lines. */
.bslots,.btray{display:flex;flex-direction:column;align-items:center;gap:6px}
.lrow{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px}
.bslots .lslot,.btray .tile{box-sizing:border-box;width:var(--t,52px);min-width:0;height:calc(var(--t,52px)*1.12);padding:0;justify-content:center;flex:none}
.bslots .lslot b,.btray .tile b{font-size:calc(var(--t,52px)*.52)}
.lslot.hole{display:block;border-radius:10px;border:2px dashed var(--line);background:color-mix(in srgb,var(--card) 60%,transparent)}
.slots.bslots{min-height:0}
/* ABC order */
.abcslots{list-style:none;margin:0;counter-reset:abc}
.abcslots li{counter-increment:abc;flex-direction:row;gap:6px}
.abcslots li.tile::before{content:counter(abc);font-size:.75rem;font-weight:800;color:var(--muted)}
.abcslots .ph{opacity:.6;font-weight:700;letter-spacing:.1em}
/* Sound sort: many small bins */
.sbins{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.sbins .bin{min-height:96px}
.bhead small em{font-style:normal;font-weight:800;font-size:1.15em}
/* Proofread */
.passage{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--line);font-size:1.12rem;line-height:1.9;display:flex;flex-direction:column;gap:10px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(1.9em - 1px),color-mix(in srgb,var(--rule) 45%,transparent) calc(1.9em - 1px) 1.9em)}
.passage p{margin:0}
.pw{font:inherit;color:inherit;background:none;border:0;padding:0 1px;margin:0;border-radius:4px;cursor:pointer;line-height:inherit}
.pw:hover{background:color-mix(in srgb,var(--primary) 14%,transparent)}
.pw.found{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;outline:2px solid var(--bad)}
.pw.fixed{background:var(--good-bg);color:var(--good);font-weight:700;cursor:default}
.pw.nope{animation:shake .35s}
.bad-word{color:var(--bad);font-size:1.15em}
.fixlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.fixlist span{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 10px;border-radius:10px;border:1.5px dashed var(--line);font-weight:700}
.fixlist span.on{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--good)}
.fixlist i{font-style:normal;font-size:.75rem;color:var(--muted);font-weight:800}
/* Match and Memory */
.mbtn.msent{font-size:.95rem;line-height:1.35}
.mbtn.msent .blank{display:inline-block;min-width:3.2em;border-bottom:2.5px solid currentColor;margin:0 2px}
.mbtn.msent mark{background:transparent;color:inherit;text-decoration:underline;text-underline-offset:3px}
.tile2.up.clue{font-weight:600;font-size:clamp(.72rem,2.3vw,.9rem);line-height:1.25}
.tile2.up.clue .blank{display:inline-block;min-width:2.2em;border-bottom:2px solid currentColor}
/* Speed round */
.srword{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 10px;background:var(--paper);color:var(--paper-ink);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
.srword>span{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,11vw,3.2rem);letter-spacing:.04em;line-height:1.1;overflow-wrap:anywhere}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .opt{text-align:center;font-size:1.3rem;min-height:64px}
.yn .opt.yes:not(:disabled){border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.yn .opt.no:not(:disabled){border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.srfreeze .good{color:var(--good)}
/* Tests */
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:12px 14px}
.tcard.fin{background:color-mix(in srgb,var(--hi) 18%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--hi) 60%,transparent)}
.tcard>b{font-family:var(--display);font-size:1.2rem}.tcard .hkick{margin:0}.tcard .btn{margin-top:4px}
.tsheet .gtop .note{font-variant-numeric:tabular-nums}
.testgrid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:end;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:10px 14px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.testgrid .n{font-weight:800;font-size:.95rem;padding-bottom:8px;text-align:right;min-width:2em;font-variant-numeric:tabular-nums}
.testgrid input{font:inherit;font-size:1.35rem;font-weight:700;color:inherit;border:0;border-bottom:2px solid var(--rule);background:transparent;padding:4px 4px 2px;width:100%;min-width:0;border-radius:0}
.testgrid input:focus-visible{outline:none;border-bottom-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
.testgrid input.ok{color:var(--good);border-bottom-color:var(--good)}
.testgrid input.bad{color:var(--bad);border-bottom-color:var(--bad);text-decoration:line-through}
.testgrid .sect{grid-column:1/-1;margin:12px 0 0}
.tsay{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--primary);display:grid;place-items:center;padding:0;cursor:pointer}
.tsay:hover{border-color:var(--primary)}
.key{font-weight:800;font-size:1.15rem;padding-bottom:6px;white-space:nowrap}.key.ok{color:var(--good)}.key.bad{color:var(--bad)}
.tres{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stamp{display:inline-block;border:3px solid currentColor;border-radius:10px;padding:2px 14px;font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;rotate:-6deg;font-size:1.2rem}
.stamp.ok{color:var(--good)}.stamp.bad{color:var(--bad)}
/* Daily review: missed words */
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mlist li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
.mlist b{flex:1;font-size:1.2rem;min-width:0;overflow-wrap:anywhere}
.mlist .pill{background:var(--bad-bg);color:var(--bad)}
html.nospeak .mlist li{padding:10px 0}
.empty .fg-ico{font-size:2.6rem;line-height:1}
.pmark{display:block;font-size:.75rem;color:var(--muted)}
.ctable td:nth-child(3) .pdots{white-space:nowrap}
</style>
</head>
<body>
<!-- trophy mascot colours, kept outside any hidden section so they always render -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="mGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE27A"/><stop offset=".45" stop-color="#F8BE2E"/><stop offset="1" stop-color="#E39A12"/></linearGradient>
    <linearGradient id="mGoldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98F"/><stop offset="1" stop-color="#F2AE22"/></linearGradient>
    <linearGradient id="mBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C2B4C"/><stop offset="1" stop-color="#6A1A33"/></linearGradient>
  </defs></svg>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="btoast" id="badgeToast" hidden role="status" aria-live="polite"></div>
<div class="rtoast" id="rToast" hidden role="status" aria-live="polite"></div>
<div class="wrap notranslate" translate="no" lang="en">
  <header>
    <div>
      <h1><button type="button" class="titlebtn" id="homeTitle" aria-label="Spelling Champion: go to the home screen">Spelling <mark>Champion</mark></button></h1>
      <div id="whoami"></div>
    </div>
    <div class="grp">
      <button class="btn small" id="soundBtn" aria-pressed="true">Sound on</button>
      <div class="dispwrap"><button class="btn small" id="dispBtn" aria-expanded="false" aria-controls="dispPop" aria-label="Display options" title="Display options"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg><span class="blbl">Display</span></button>
        <div class="disppop" id="dispPop" hidden role="group" aria-label="Display options">
          <p class="plabel" style="margin:0">Text size</p>
          <div class="seg" id="tsSeg"><button type="button" data-ts="">A</button><button type="button" data-ts="ts-l" style="font-size:1.15em">A</button><button type="button" data-ts="ts-xl" style="font-size:1.35em">A</button></div>
          <label class="tog" for="optEasy"><input type="checkbox" id="optEasy"><span><b>Easier reading</b><small>More space between letters, words and lines</small></span></label>
          <label class="tog" for="optCalm"><input type="checkbox" id="optCalm"><span><b>Calm mode</b><small>No confetti, pop-ups or moving effects</small></span></label>
          <label class="tog" for="optSpeak"><input type="checkbox" id="optSpeak"><span><b>Read aloud buttons</b><small>Show speaker buttons to hear words and sentences</small></span></label>
        </div></div>
    </div>
  </header>

  <div id="studentView" style="display:flex;flex-direction:column;gap:18px">
    <div class="namebar" id="namebar">
      <label for="nameInput">👋 What's your name, champion?</label>
      <div class="grp"><input id="nameInput" maxlength="40" placeholder="Your name" autocomplete="off"><button class="btn small primary" id="nameSave">Save</button></div>
    </div>
    <div class="bar">
      <div class="tabwrap" id="tabWrap"><button type="button" class="tabarrow l" id="tabPrev" aria-label="Show earlier modes" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg></button>
      <div class="tabs modetabs" id="modeTabs" role="tablist" aria-label="Ways to practice">
        <button id="tab-home" role="tab" aria-selected="true"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="d" d="M5.5 10.2 12 4.8l6.5 5.4V20h-13z"/><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></svg><span>Home</span></button>
        <button id="tab-plan" role="tab" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="d" d="M9 4v13.5L3 20V6.5zM21 4v13.5L15 20V6.5z"/><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>Plan</span></button>
        <button id="tab-cards" role="tab" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect class="d" x="3.5" y="5.5" width="11" height="15" rx="2" transform="rotate(-10 9 13)"/><rect x="3.5" y="5.5" width="11" height="15" rx="2" transform="rotate(-10 9 13)"/><rect x="9" y="3.5" width="11.5" height="16" rx="2" class="bg"/><path d="M12.5 9.5h5M12.5 13h3.5"/></svg><span>Flashcards</span></button>
        <button id="tab-review" role="tab" aria-selected="false"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="d" d="M3 8a2.5 2.5 0 0 1 2.5-2.5h13A2.5 2.5 0 0 1 21 8v2H3z"/><rect x="3" y="5.5" width="18" height="15.5" rx="2.5"/><path d="M3 10h18M8 3v4.5M16 3v4.5"/><path d="m8.5 15.2 2.4 2.3 4.6-4.6"/></svg><span>Daily review</span></button>

/* Shuffle bags (from Root Detective): each game deals items in a random order and uses every item once before any repeats. */
const BAGS={};
function draw(key,list,n,keyOf){
  keyOf=keyOf||(x=>x.id);
  if(!list.length)return[];
  const sig=list.map(keyOf).join(',');
  let b=BAGS[key];if(!b||b.sig!==sig)b=BAGS[key]={sig,q:[],last:null};
  const out=[];
  while(out.length<n){
    if(!b.q.length){
      b.q=shuf(list).filter(x=>!out.includes(x)||out.length>=list.length);
      if(!b.q.length)b.q=shuf(list);
      if(b.q.length>1&&b.q[b.q.length-1]===b.last){const t=b.q[0];b.q[0]=b.q[b.q.length-1];b.q[b.q.length-1]=t}
    }
    const x=b.q.pop();b.last=x;out.push(x);
  }
  return out;
}

/* ---------- Progress history: one record per day (Root Detective's HIST.days) ---------- */
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const HIST=(()=>{const h=store.get('sc-history',null);return h&&typeof h==='object'&&h.days?h:{name:'',days:{}}})();
/* S: the current week, words marked "I know this", and every word missed (the Daily review list) */
const S=Object.assign({cur:1,known:{},missed:{}},store.get('sc-state',null)||{});
function saveS(){store.set('sc-state',S)}
let lastAct=0;
function today(){const k=dayKey();return HIST.days[k]=HIST.days[k]||{min:0}}
function touch(){const now=Date.now(),gap=now-lastAct;if(lastAct&&gap<120000){const d=today();d.ms=(d.ms||0)+gap;d.min=Math.round(d.ms/6000)/10}lastAct=now}
function saveLocal(){store.set('sc-history',HIST)}
function rec(fn){touch();const d=today();fn(d);d.wk=S.cur;saveLocal();if(typeof checkBadges==='function')checkBadges()}
const bump=(o,k,n=1)=>{o[k]=(o[k]||0)+n};
const sub=(d,k)=>d[k]=d[k]||{};
/* one answered item: right on the first try or not */
function answer(w,ok){rec(d=>{const a=sub(d,'ans');bump(a,'t');if(ok){bump(a,'c');bump(sub(d,'right'),w)}else bump(sub(d,'miss'),w)})}
function addMissed(word){S.missed[word]=(S.missed[word]||0)+1;saveS()}
function clearMissed(word){if(S.missed[word]){S.missed[word]--;if(S.missed[word]<=0)delete S.missed[word];saveS()}}

/* Bring over progress from the first version of the app (localStorage "spellingchampion_v1"), once */
(function migrate(){try{
  if(store.get('sc-migrated',false))return;store.set('sc-migrated',true);
  const old=store.get('spellingchampion_v1',null);if(!old||typeof old!=='object')return;
  if(old.cur)S.cur=old.cur;Object.assign(S.missed,old.missed||{});
  const dk=t=>dayKey(new Date(t||Date.now()));
  for(const n in old.flash||{}){const f=old.flash[n];if(!f)continue;if((f.known||[]).length)S.known[n]=f.known.slice();
    const t=((old.log||[]).find(l=>l.a==='cards'&&l.week===+n)||{}).t,d=HIST.days[dk(t)]=HIST.days[dk(t)]||{min:0},fc=sub(d,'fc');
    fc.f=(fc.f||[]).concat((f.seen||[]).map(w=>n+':'+w));fc.b=(fc.b||[]).concat((f.seen||[]).map(w=>n+':'+w))}
  for(const l of old.log||[]){if(l.a==='cards')continue;const d=HIST.days[dk(l.t)]=HIST.days[dk(l.t)]||{min:0};
    if(l.a==='test'||l.a==='pretest'){const x=sub(sub(d,'test'),l.week),k=l.a==='test'?'fin':'pre',o=x[k]=x[k]||{};if(o.f==null)o.f=l.score;o.s=Math.max(o.s||0,l.score);o.l=l.score;bump(o,'n');o.t=l.total}
    else{const o=sub(sub(d,'act'),l.a);bump(o,'r');if(l.pass)bump(o,'p');o.best=Math.max(o.best||0,l.score||0);bump(sub(sub(d,'wkr'),l.week),l.a)}}
  const lastDay=Object.keys(HIST.days).sort().pop()||dayKey(),ld=HIST.days[lastDay]=HIST.days[lastDay]||{min:0};
  for(const a in old.passes||{})for(const n in old.passes[a]){bump(sub(sub(ld,'actr'),n),a,old.passes[a][n])}
  saveS();saveLocal();
}catch(e){}})();

/* ---------- Tests and week unlocking: week N+1 opens when week N's Final test is passed (80%) ---------- */
const PASS_PCT=.8;
const passMark=total=>Math.ceil(total*PASS_PCT);
function testHist(){const out={};Object.keys(HIST.days).sort().forEach(k=>{const t=HIST.days[k].test||{};
  for(const w in t)for(const a of ['pre','fin']){const x=t[w][a];if(!x)continue;const o=out[w]=out[w]||{};const r=o[a]=o[a]||{first:null,best:0,last:0,n:0,total:x.t};
    if(r.first==null)r.first=x.f;r.best=Math.max(r.best,x.s||0);r.last=x.l;r.n+=x.n||1;r.total=x.t||r.total}});return out}
function weekPassed(n,th){th=th||testHist();const h=th[n];return !!(h&&h.fin&&h.fin.best>=passMark(h.fin.total))}
function unlockedWeeks(){const th=testHist(),u=[1];for(let n=2;n<=NW;n++){if(weekPassed(n-1,th))u.push(n);else break}return u}
const isUnlocked=n=>unlockedWeeks().includes(n);
function frontierWeek(){const th=testHist(),u=unlockedWeeks();return u.find(n=>!weekPassed(n,th))||u[u.length-1]}
const avail=()=>unlockedWeeks().filter(hasList);
function setCur(n){S.cur=n;saveS()}
if(!isUnlocked(S.cur))setCur(frontierWeek());

/* ---------- Flashcards first: both sides of every card in the current week ---------- */
function fcSides(){const f=new Set(),b=new Set();for(const k in HIST.days){const x=HIST.days[k].fc;if(x){(x.f||[]).forEach(i=>f.add(i));(x.b||[]).forEach(i=>b.add(i))}}return{f,b}}
function fcGate(n=S.cur){const {f,b}=fcSides();if(!hasList(n))return{n,ids:[],f,b,done:0,ok:true};const ids=weekWords(n).map(wid),done=ids.filter(i=>f.has(i)&&b.has(i)).length;return{n,ids,f,b,done,ok:done>=ids.length}}
const flashDone=n=>hasList(n)&&fcGate(n).ok;
/* locked while there is nothing else to practice: the current week's flashcards come first */
function fcLocked(){const g=fcGate();if(g.ok)return false;return avail().every(n=>n===S.cur)}
/* Each new week opens in steps:
   1. the pretest (only Home, Plan, Tests and Progress are open)
   2. the flashcards, both sides of every card (only the flashcards open)
   3. the required activities, each passed 3 times (only those, plus the flashcards)
   4. the final test opens, and so does everything else.
   A week that's already passed, or has no words yet, is fully open. */
const pretestDone=(n=S.cur)=>{const h=testHist()[n];return !!(h&&h.pre)};
const ALWAYS_OPEN=['home','plan','tests','progress'];
const FINAL_REQ=['sort','abc','proof','build','spell'];
function finalReqs(n=S.cur){const W=WK(n);return FINAL_REQ.filter(a=>{const k=ACTS[a].needs;return !k||(Array.isArray(W[k])?W[k].length:W[k])}).map(a=>({a,name:ACTS[a].name,n:Math.min(3,passCount(a,n))}))}
const finalOpen=(n=S.cur)=>weekPassed(n,testHist())||finalReqs(n).every(r=>r.n>=3);
function weekStep(n=S.cur){if(!hasList(n)||weekPassed(n,testHist()))return'open';if(!pretestDone(n))return'pre';if(!flashDone(n))return'cards';if(!finalOpen(n))return'req';return'open'}
const preLocked=()=>weekStep()==='pre';
function modeLocked(m){if(ALWAYS_OPEN.includes(m))return false;const st=weekStep();
  if(st==='pre')return true;if(st==='cards')return m!=='cards';if(st==='req')return m!=='cards'&&!finalReqs().some(r=>r.a===m);return false}
function lockWhy(){const st=weekStep();return st==='pre'?'Locked until you take the pretest':st==='cards'?'Locked until you study the flashcards':'Opens with the final test'}

/* ---------- Activities & the 3-passes rule ----------
   Before the week's flashcards are done, activities use all your weeks.
   Afterwards, each activity sticks to the current week until it has been passed 3 times. */
const ACTS={
  spell:{name:'Spell it',desc:'Hear the word, then type it.',pass:'8 of 10'},
  build:{name:'Build it',desc:'Tap the letters in the right order.',pass:'6 of 8'},
  quiz:{name:'Quiz',desc:'Pick the right spelling.',pass:'8 of 10'},
  match:{name:'Match',desc:'Match each word to its meaning.',pass:'2 misses or fewer'},
  memory:{name:'Memory',desc:'Flip tiles to pair words with rhymes and meanings.',pass:'12 turns or fewer'},
  rhyme:{name:'Rhyme time',desc:'Pick the spelling word that rhymes.',pass:'80%',needs:'rhymes'},
  sort:{name:'Sound sort',desc:'Sort words by sound and spelling pattern.',pass:'80%',needs:'sort'},
  abc:{name:'ABC order',desc:'Put words in ABC or reverse ABC order.',pass:'2 of 3 sets'},
  proof:{name:'Proofread',desc:'Find the misspelled words and fix them.',pass:'5 of 6',needs:'proof'},
  speed:{name:'Speed round',desc:'60 seconds: is it spelled right?',pass:'10 right'}
};
function passCount(a,n){let c=0;for(const k in HIST.days){const r=((HIST.days[k].actr||{})[n]||{})[a];if(r)c+=r}return c}
function scope(a){
  const all=avail();
  if(!hasList(S.cur)||!flashDone(S.cur))return{weeks:all,limited:false};
  if(passCount(a,S.cur)<3)return{weeks:[S.cur],limited:true};
  return{weeks:all,limited:false};
}
const scopeLabel=a=>scope(a).limited?`Week ${S.cur} only`:'All weeks';
function scopeWeeksWith(a){const sc=scope(a),need=ACTS[a]&&ACTS[a].needs;return sc.weeks.filter(n=>need?(Array.isArray(WK(n)[need])?WK(n)[need].length:WK(n)[need]):true)}
function poolFor(a){const ws=scopeWeeksWith(a),seen=new Set();return ws.flatMap(n=>weekWords(n)).filter(o=>!seen.has(o.w)&&seen.add(o.w))}
/* a passed round counts toward the current week once its flashcards are done, while the round used that week's words */
const countsFor=a=>hasList(S.cur)&&flashDone(S.cur)&&scope(a).weeks.includes(S.cur);
function didThisWeek(k){for(const d of Object.values(HIST.days)){if(((d.wkr||{})[S.cur]||{})[k])return true}return false}

/* ---------- Mastery: right 3+ times and 80%+ of the time ---------- */
function wordStats(){const st={};Object.keys(HIST.days).sort().forEach(k=>{const d=HIST.days[k];
  for(const w in d.right||{}){const o=st[w]=st[w]||{r:0,m:0,last:k};o.r+=d.right[w];o.last=k}
  for(const w in d.miss||{}){const o=st[w]=st[w]||{r:0,m:0,last:k};o.m+=d.miss[w];o.last=k}});return st}
const isMastered=o=>!!o&&o.r>=3&&o.r/(o.r+o.m)>=.8;
const daysSince=k=>{if(!k)return 99;const [y,m,d]=k.split('-').map(Number);return Math.round((new Date()-new Date(y,m-1,d))/864e5)};

/* ---------- Streak ---------- */
function activeDay(d){return !!d&&(Object.keys(d).some(k=>k!=='min'&&k!=='wk')||(d.min||0)>0)}
function currentRun(days){const d=new Date();let n=0;if(!activeDay(days[dayKey(d)]))d.setDate(d.getDate()-1);
  while(activeDay(days[dayKey(d)])){n++;d.setDate(d.getDate()-1)}return n}
function bestRun(days){const ks=Object.keys(days).filter(k=>activeDay(days[k])).sort();let best=0,run=0,prev=null;
  for(const k of ks){const d=new Date(k+'T12:00');if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;best=Math.max(best,run);prev=d}return best}

/* ---------- Modes ---------- */
const MODES=['home','plan','cards','review','spell','build','quiz','match','memory','rhyme','sort','abc','proof','speed','tests','progress'];
const FC_FREE=['home','plan','cards','progress','tests'];
const MODE_NAME={home:'Home',plan:'Plan',cards:'Flashcards',review:'Daily review',tests:'Tests',progress:'Progress'};
let mode='home';
function setMode(m,noStart){
  if(m!=='speed')stopSpeedIfLeaving();
  if(m!==mode){try{FX.clear()}catch(e){}try{SPEAK.stop()}catch(e){}}
  mode=m;const locked=modeLocked(m);
  MODES.forEach(x=>{$(x).hidden=x!==m||locked;$('tab-'+x).setAttribute('aria-selected',x===m)});
  $('fcGate').hidden=!locked;if(locked)({pre:renderPreGate,cards:renderFcGate,req:renderReqGate}[weekStep()]||renderFcGate)();
  updateFcTabs();renderHeld();centerTab(m);
  document.body.classList.toggle('on-home',m==='home');document.body.classList.toggle('in-act',m!=='home');
  try{history.replaceState(null,'','#/'+m)}catch(e){}
  renderNameBar();
  if(!noStart&&!locked)refreshMode();
}
function refreshMode(){({home:renderHome,plan:renderPlan,cards:()=>openCards(),review:renderReview,spell:()=>startSpell(),build:startBuild,quiz:()=>startQuiz(),
  match:newMatch,memory:()=>newMemory(),rhyme:startRhyme,sort:startSort,abc:startAbc,proof:startProof,speed:renderSpeedStart,tests:renderTests,progress:renderProgress}[mode]||renderHome)()}
function centerTab(m,instant){const c=$('modeTabs'),t=$('tab-'+m);if(!c||!t||c.scrollWidth<=c.clientWidth+2)return;const left=t.offsetLeft-(c.clientWidth-t.offsetWidth)/2;
  try{c.scrollTo({left,behavior:instant||document.documentElement.classList.contains('calm')?'auto':'smooth'})}catch(e){c.scrollLeft=left}}
function updateFcTabs(){const why=lockWhy();
  document.querySelectorAll('.hgame[data-go]').forEach(b=>{const g=modeLocked(b.dataset.go);b.classList.toggle('gated',g);if(g)b.setAttribute('aria-description',why);else b.removeAttribute('aria-description')});
  MODES.forEach(m=>{const t=$('tab-'+m);if(!t)return;const g=modeLocked(m);t.classList.toggle('gated',g);if(g)t.setAttribute('aria-description',why);else t.removeAttribute('aria-description')})}
/* the line above an activity: which weeks it uses right now */
function renderHeld(){const el=$('fcHeldNote'),a=ACTS[mode]?mode:null;
  if(!a||modeLocked(mode)){el.hidden=true;return}
  const g=fcGate();
  if(hasList(S.cur)&&!g.ok){el.hidden=false;el.innerHTML=`<span aria-hidden="true">🗂️</span><span>Activities use all your weeks until the week ${S.cur} flashcards are done (${g.done}/${g.ids.length}).</span><button class="linkish" id="fhGo">Study them</button>`;$('fhGo').onclick=fcGo;return}
  if(scope(a).limited){el.hidden=false;el.innerHTML=`<span aria-hidden="true">🎯</span><span>Week ${S.cur} words only until you pass ${ACTS[a].name} 3 times (${passCount(a,S.cur)} of 3). Then all your weeks mix in.</span>`;return}
  el.hidden=true}
function renderFcGate(){const g=fcGate(),el=$('fcGate'),n=g.ids.length,pct=n?Math.round(g.done/n*100):100;
  el.innerHTML=`<div class="wcard fg-card"><div class="fg-ico" aria-hidden="true">🗂️</div><p class="hkick">Week ${g.n}</p><h2>First, study the flashcards</h2>
    <p class="fg-sub">Look at <b>both sides</b> of every week ${g.n} card: the word, then tap to flip and read its sentence. Then all the activities open up.</p>
    <div class="fg-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${g.done}" aria-label="Cards studied on both sides"><i style="width:${pct}%"></i></div>
    <p class="fg-n"><b>${g.done} of ${n}</b> cards studied on both sides</p>
    <div class="chipset fg-chips">${weekWords(g.n).map(o=>{const id=wid(o),both=g.f.has(id)&&g.b.has(id),half=!both&&(g.f.has(id)||g.b.has(id));return`<span class="chip ${kindClass(o)} ${both?'ok':half?'half':'todo'}">${both?'✓ ':''}${esc(o.w)}</span>`}).join('')}</div>
    <button class="btn primary big" id="fgGo">${g.done?'Keep going with the flashcards':'Go to the flashcards'} →</button></div>`;
  $('fgGo').onclick=fcGo}
function renderPreGate(){const el=$('fcGate'),n=S.cur,tot=weekWords(n).length;
  el.innerHTML=`<div class="wcard fg-card"><div class="fg-ico" aria-hidden="true">📝</div><p class="hkick">Week ${n} · Monday</p><h2>First, take the pretest</h2>
    <p class="fg-sub">A new week starts with the pretest: you'll hear all ${tot} words and write each one. It doesn't count toward passing, so just do your best. Then the flashcards and activities open up.</p>
    <button class="btn primary big" id="pgGo">Start the pretest →</button></div>`;
  $('pgGo').onclick=()=>startTask('pretest')}
function renderReqGate(){const el=$('fcGate'),n=S.cur,rs=finalReqs(n);
  el.innerHTML=`<div class="wcard fg-card"><div class="fg-ico" aria-hidden="true">🎯</div><p class="hkick">Week ${n}</p><h2>${esc(ACTS[mode]?ACTS[mode].name:'This')} opens with the final test</h2>
    <p class="fg-sub">First, pass each of these 3 times. Then the final test opens, and so do all the other games.</p>
    <ul class="freq" style="align-self:center">${rs.map(r=>`<li class="${r.n>=3?'ok':''}"><button class="linkish" data-req="${r.a}">${esc(r.name)}</button><span class="hgdots" aria-label="${r.n} of 3 passes">${[0,1,2].map(i=>`<i class="${r.n>i?'on':''}"></i>`).join('')}</span><span class="note">${r.n>=3?'✓ done':`${r.n} of 3`}</span></li>`).join('')}</ul>

  h+=`<div class="snake-end" style="top:${y}px">🏆 Champion!</div>`;y+=40;

  const slotRow=inRows(r.state==='ask'?Array.from({length:L},(_,k)=>k<r.slots.length?`<button type="button" class="tile c-free lslot" data-un="${k}" aria-label="Remove ${esc(r.tiles[r.slots[k]])}"><b>${esc(r.tiles[r.slots[k]])}</b></button>`:`<span class="lslot hole" aria-hidden="true"></span>`)
    :o.w.split('').map(c=>`<span class="tile c-free lslot"><b>${esc(c)}</b></span>`),lay.rows);
  $('buildBody').innerHTML=`<div class="wcard">
    ${qtop(`Word ${r.i+1} of ${n}`,r.i,n,`★ ${r.score}`)}

    <div class="slots bslots ${r.state==='right'?'ok':r.state==='reveal'?'shown':''}" id="bslots" aria-label="Your word" style="--t:${lay.t}px">${slotRow}</div>
    ${r.state==='ask'?`<p class="hintline">${r.fb?`<span class="bfb no">${esc(r.fb)}</span>`:`The word has ${L} letters.${r.tries?` Try ${r.tries+1} of 3.`:''}`}</p>
      <div class="tray btray" style="--t:${lay.t}px">${inRows(r.tiles.map((t,k)=>`<button type="button" class="tile c-free" data-i="${k}" ${r.slots.includes(k)?'disabled':''}><b>${esc(t)}</b></button>`),lay.rows)}</div>
      <div class="controls" style="justify-content:center"><button class="btn" id="bclear" ${r.slots.length?'':'disabled'}>Clear</button></div>`
    :`<p class="bfb ${r.state==='right'?'ok':'no'}">${r.state==='right'?(r.tries?'You built it!':'Built on the first try!'):'Here\'s the word. Look at each letter.'}</p><p class="sent" style="text-align:center">${markHTML(o)}</p>
      <div class="controls" style="justify-content:center"><button class="btn primary nextq" id="bnext">${r.i===n-1?'See my score':'Next word →'}</button></div>`}
  </div>`;
  {const sl=$('bslots'),cs=getComputedStyle(sl),w=sl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
   if(w>0&&Math.abs(w-guessW)>2&&r._w!==w){r._w=w;return renderBuild()}}
  const body=$('buildBody');
  body.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{r.slots.push(+b.dataset.i);r.fb='';if(r.slots.length===L)buildCheck();else renderBuild()});
  body.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{const k=+b.dataset.un;if(k<r.slots.length){r.slots=r.slots.slice(0,k);renderBuild()}});
  if($('bclear'))$('bclear').onclick=()=>{r.slots=[];renderBuild()};
  if($('bnext')){$('bnext').focus({preventScroll:true});$('bnext').onclick=()=>{r.i++;if(r.i>=n)return roundEnd('build',{score:r.score,total:n,pass:r.score>=Math.min(6,Math.ceil(n*.75)),missed:r.missed});newBuildWord();renderBuild();SPEAK.say(dictateText(r.items[r.i]))}}
}
addEventListener('resize',()=>{clearTimeout(renderBuild._rt);renderBuild._rt=setTimeout(()=>{if(mode==='build'&&BD&&BD.items&&$('bslots')){BD._w=0;renderBuild()}},150)});
function buildCheck(){
  const r=BD,o=r.items[r.i],guess=r.slots.map(k=>r.tiles[k]).join('');
  if(guess===o.w){const first=!r.tries;if(first)r.score++;r.state='right';answer(o.w,first);renderBuild();const sl=$('bslots');FX.burst(sl,40);FX.cheer(sl,FX.praise(0));FX.play('good');sl.classList.add('popin');SPEAK.say(sayOf(o))}
  else{r.tries++;if(!r.missed.includes(o.w))r.missed.push(o.w);FX.play('bad');
    if(r.tries>=3){r.state='reveal';answer(o.w,false);renderBuild();SPEAK.say(sayOf(o))}
    else{let k=0;while(k<o.w.length&&guess[k]===o.w[k])k++;
      r.fb=k?`The first ${k} letter${k>1?'s are':' is'} right. ${triesLeft(r.tries)}.`:`Not quite. ${triesLeft(r.tries)}.`;
      r.slots=r.slots.slice(0,k);renderBuild();const sl=$('bslots');sl.classList.add('no','shake')}}
}

/* ---------- Quiz: hear the word or read the sentence, then pick the right spelling ---------- */
const QN=10;let Q=null;
function makeQuiz(o){const t=Math.random()<.5?'hear':'blank';return{o,t,ans:o.w,opts:shuf([o.w,...misspell(o.w,3)])}}
function startQuiz(list,tag={}){
  const src=list&&list.length?list:poolFor('quiz');
  const el=tag.review?'reviewBody':'quizBody';
  if(!src.length){$(el).innerHTML=`<div class="empty"><h2>No words yet</h2></div>`;return}
  const picks=list&&list.length?list.slice(0,QN):draw('quiz',src,Math.min(QN,src.length),wkey);
  Q={qs:picks.map(makeQuiz),i:0,score:0,missed:[],tag,el,streak:0};renderQ(true);
}
function renderQ(autoSay){
  const q=Q.qs[Q.i],o=q.o,N=Q.qs.length;

    ${q.t==='hear'?`<p class="prompt">Which is the right spelling of the word you hear?</p>
      <div class="spellask"><button type="button" class="bigsay" data-say="${esc(sayOf(o))}" aria-label="Hear the word again">${SPK}<span>Hear the word</span></button></div>`
      :`<p class="prompt">Which spelling fits the blank?</p><div class="sayrow"><p class="sent">${blankHTML(o)}</p>${sayBtn(sentenceFor(o),'Hear the sentence')}</div>`}
    <div class="opts">${q.opts.map((x,k)=>`<button class="opt spopt" id="opt${k}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <div id="fbslot"></div></div>`;
  $(Q.el).querySelectorAll('.opt').forEach(b=>b.onclick=()=>quizAnswer(b));
  if(autoSay&&q.t==='hear')setTimeout(()=>{if(Q&&Q.qs[Q.i]===q&&!q.done)SPEAK.say(sayOf(o))},250);
}
function quizAnswer(b){
  const q=Q.qs[Q.i],ok=b.dataset.v===q.ans,o=q.o;if(q.done)return;q.done=true;
  $(Q.el).querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===q.ans)x.classList.add('right')});
  answer(o.w,ok);
  if(ok){Q.score++;Q.streak++;FX.burst(b,24);FX.cheer(b,FX.praise(Q.streak));FX.play('good');b.classList.add('popin')}else{Q.streak=0;FX.play('bad');b.classList.add('wrong');if(!Q.missed.includes(o.w))Q.missed.push(o.w)}
  const last=Q.i===Q.qs.length-1;

    <p>It's spelled <mark>${esc(o.w)}</mark>${ok?'':`, not “${esc(b.dataset.v)}”`}.</p><p class="sent">${markHTML(o)}</p>
    <div class="grp"><button class="btn primary nextq" id="qnext">${last?'See my score':'Next question →'}</button></div></div>`;

function quizResults(){

    $(Q.el).innerHTML=`<div class="qcard">${qtop('Daily review done',1,1,`★ ${s}`)}${starRow(s>=N*.95?3:s>=N*.8?2:s>=N/2?1:0)}<p class="score">${s} / ${N}</p>
      <p class="prompt">${s===N?'Perfect review!':'Daily review done. Come back tomorrow for a new set.'}</p>
      ${Q.missed.length?`<div><p class="note" style="margin-bottom:8px">Words to practice:</p><div class="chips">${Q.missed.map(w=>`<span><mark>${esc(w)}</mark></span>`).join('')}</div></div>`:''}
      <div class="grp"><button class="btn primary" id="revBack">Back to Daily review</button><button class="btn" data-home>Home</button></div></div>`;
    $('revBack').onclick=renderReview;return}

/* ---------- Match: pair each word with its sentence ---------- */
function pickWords(a,n){const p=poolFor(a),out=[],seen=new Set();for(const o of draw(a,p,Math.min(p.length,n*2),wkey)){if(out.length>=n)break;if(seen.has(o.w)||seen.has(o.s))continue;seen.add(o.w);seen.add(o.s);out.push(o)}return out}
let M=null;
/* the meaning's first sentence ("good, clear thinking") is enough to match on */
const shortMean=o=>(o.m||o.s).split(/\.\s/)[0].replace(/\.$/,'');
function newMatch(){const cs=pickWords('match',6);if(cs.length<2)return emptyAct('match','Not enough words yet.');
  M={cs,left:shuf(cs),right:shuf(cs),done:new Set(),sel:null,miss:0,t0:Date.now(),streak:0,best:0,missed:new Set()};renderMatch()}
function renderMatch(){
  const fin=M.done.size===M.cs.length,secs=Math.round(((M.t1||Date.now())-M.t0)/1000);
  const isSel=(side,w)=>!!(M.sel&&M.sel.side===side&&M.sel.w===w);
  $('matchBody').innerHTML=`<div class="wcard"><div class="gtop"><b>Match each word to its meaning</b><span class="grp">${fin?'':streakPill(M.streak)}<span class="note">${M.done.size} of ${M.cs.length} matched · ${plural(M.miss,'miss','misses')}</span></span></div>
   <div class="mcols"><div class="mcol">${M.left.map(o=>`<button class="mbtn part ${kindClass(o)} ${M.done.has(o.w)?'done':''} ${isSel('l',o.w)?'sel':''}" data-l="${esc(o.w)}" aria-pressed="${isSel('l',o.w)}" ${M.done.has(o.w)?'disabled':''}>${esc(o.w)}</button>`).join('')}</div>
   <div class="mcol">${M.right.map(o=>`<button class="mbtn msent ${M.done.has(o.w)?'ok done':''} ${isSel('r',o.w)?'sel':''}" data-r="${esc(o.w)}" aria-pressed="${isSel('r',o.w)}" ${M.done.has(o.w)?'disabled':''}>${esc(shortMean(o))}</button>`).join('')}</div></div>
   ${fin?'':`<p class="note" style="margin:0;text-align:center">Tap a word and its meaning, in either order.</p>`}</div>`;
  const pick=(side,w)=>{
    if(!M.sel||M.sel.side===side){M.sel=isSel(side,w)?null:{side,w};renderMatch();const e=$('matchBody').querySelector(`[data-${side}="${CSS.escape(w)}"]`);if(e)e.focus({preventScroll:true});return}
    const lw=side==='l'?w:M.sel.w,rw=side==='r'?w:M.sel.w;
    if(lw===rw){const q=k=>$('matchBody').querySelector(`[data-${k}="${CSS.escape(lw)}"]`).getBoundingClientRect(),lr=q('l'),rr=q('r');
      M.done.add(lw);M.sel=null;M.streak++;M.best=Math.max(M.best,M.streak);const fin=M.done.size===M.cs.length;if(fin)M.t1=Date.now();
      renderMatch();FX.burst(lr,18);FX.burst(rr,26);FX.cheer(side==='r'?rr:lr,FX.praise(M.streak));FX.play('good');
      ['l','r'].forEach(k=>{const e=$('matchBody').querySelector(`[data-${k}="${CSS.escape(lw)}"]`);if(e)e.classList.add('popin')});
      if(fin){M.cs.forEach(o=>{if(!M.missed.has(o.w))rec(d=>bump(sub(d,'right'),o.w))});const t=Math.round((M.t1-M.t0)/1000);
        setTimeout(()=>roundEnd('match',{score:M.cs.length-M.missed.size,total:M.cs.length,pass:M.miss<=2,missed:[...M.missed],top:`${t} sec`,
          stars:M.miss===0?3:M.miss<=2?2:1,msg:M.miss===0?'Perfect match!':'All matched!',extra:`<p class="note" style="margin:0">${t} seconds, ${plural(M.miss,'miss','misses')}${M.best>=3?`, best streak ${M.best}`:''}.</p>`,
          rec:(d,x)=>{bump(x,'miss',M.miss);x.fast=Math.min(x.fast||99999,t);if(!M.miss)bump(x,'perfect')}}),700)}}
    else{M.miss++;M.streak=0;M.missed.add(lw);rec(d=>bump(sub(d,'miss'),lw));FX.play('bad');M.sel=null;renderMatch();const e=$('matchBody').querySelector(`[data-${side}="${CSS.escape(w)}"]`);if(e)e.classList.add('shake')}
  };
  $('matchBody').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>pick('l',b.dataset.l));
  $('matchBody').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>pick('r',b.dataset.r));
}

/* ---------- Memory: flip tiles to pair each word with a rhyme or a simple definition (a sentence only if a word has no meaning yet) ---------- */
/* rough rhyme sound of a word, to keep "rhymes with cuff" from fitting two words in one round */
const rhymeKey=w=>{let s=w.toLowerCase().replace(/ough$/,'uf').replace(/augh$/,'af').replace(/ue/,'e').replace(/ea/,'e').replace(/ck$/,'k').replace(/tch$/,'ch').replace(/([a-z])\1/g,'$1').replace(/se$/,'s').replace(/([^aeiou])e$/,'$1');const m=s.match(/[aeiou][^aeiou]*$/);return m?m[0]:s};
let G=null,memPeek=store.get('sc-mem-peek',false)===true;
function newMemory(go){const cs=pickWords('memory',6);if(cs.length<2)return emptyAct('memory','Not enough words yet.');
  const rows=WEEKS.flatMap(W=>W.rhymes),keys=cs.map(o=>rhymeKey(sayOf(o)));
  const clues=cs.map((o,i)=>{const r=rows.find(x=>x[2]===o.w);const clash=r&&cs.some((p,j)=>j!==i&&keys[j]===rhymeKey(r[0]));const rh=r&&!clash?{t:'rhyme',text:`rhymes with “${r[0]}”`}:null;if(!o.m)return rh||{t:'sent',html:blankHTML(o)};return rh&&Math.random()<.5?rh:{t:'def',text:shortMean(o)}});
  const tiles=shuf(cs.flatMap((o,i)=>[{o,part:true},{o,part:false,clue:clues[i]}]));
  G={cs,tiles,up:[],got:new Set(),moves:0,lock:true,streak:0,best:0,wait:true};
  if(go===true)startMemory();else renderMemory()}
function startMemory(){const g=G;if(!g||!g.wait)return;g.wait=false;
  if(memPeek){g.peek=true;g.lock=true;renderMemory();g.peekT=setTimeout(()=>{if(G!==g)return;g.peek=false;g.lock=false;g.flipping=true;renderMemory();setTimeout(()=>{if(G===g)g.flipping=false},450)},3000)}
  else{g.lock=false;renderMemory();const t=$('memoryBody').querySelector('[data-i]');if(t)t.focus({preventScroll:true})}
  try{FX.play('flip')}catch(e){}}
const tileFace=t=>t.part?esc(t.o.w):t.clue.t==='sent'?t.clue.html:esc(t.clue.text);
const tileLabel=t=>t.part?t.o.w:t.clue.t==='sent'?blankPlain(t.o):t.clue.text;
function renderMemory(){
  const fin=G.got.size===G.cs.length;
  $('memoryBody').innerHTML=`<div class="wcard"><div class="gtop"><b>Find each word and its clue</b><span class="grp">${fin?'':streakPill(G.streak)}<span class="note">${G.got.size} of ${G.cs.length} pairs · ${plural(G.moves,'turn')}</span></span></div>
    <div class="memopts"><label class="switch peektog" for="memPeek"><input type="checkbox" role="switch" id="memPeek" ${memPeek?'checked':''}><span class="sw" aria-hidden="true"></span><span class="swtext"><b>Peek first</b><small>See every card for 3 seconds when a round starts</small></span></label>
      ${G.peek?`<span class="peeknote" role="status">👀 Memorize the cards!<i class="peekbar"></i></span>`:''}</div>
    <div class="mwrap ${G.wait?'waiting':''}"><div class="mgrid ${G.peek?'peeking':''}" ${G.wait?'aria-hidden="true"':''}>${G.tiles.map((t,i)=>{const open=G.peek||G.up.includes(i)||G.got.has(t.o.w);
      return`<button class="tile2 ${open?'up':'back'} ${open&&t.part?'part '+kindClass(t.o):''} ${open&&!t.part?'clue':''} ${G.got.has(t.o.w)?'got':''} ${G.flipping&&!G.got.has(t.o.w)?'flipdown':''}" data-i="${i}" aria-label="${open?esc(tileLabel(t)):'Hidden tile'}" ${G.got.has(t.o.w)||G.peek||G.wait?'disabled':''}>${open?tileFace(t):''}</button>`}).join('')}</div>
      ${G.wait?`<div class="memstart" id="memStart"><button type="button" class="btn primary memgo" id="memGo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>Start</button><p>${G.cs.length} pairs${memPeek?' · 3-second peek':' to find'}</p></div>`:''}</div></div>`;
  const pk=$('memPeek');pk.onchange=()=>{memPeek=pk.checked;store.set('sc-mem-peek',memPeek);if(G.wait){renderMemory();return}if(!G.moves&&!G.got.size){clearTimeout(G.peekT);newMemory(true)}};
  const go=$('memGo'),ms=$('memStart');if(go)go.onclick=e=>{e.stopPropagation();startMemory()};if(ms)ms.onclick=startMemory;
  $('memoryBody').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;if(G.lock||G.up.includes(i))return;
    G.up.push(i);
    if(G.up.length===2){G.moves++;const [a,b2]=G.up.map(k=>G.tiles[k]);
      if(a.o.w===b2.o.w&&a.part!==b2.part){const ks=G.up.slice(),rs=ks.map(k=>$('memoryBody').querySelector(`[data-i="${k}"]`).getBoundingClientRect());
        G.got.add(a.o.w);G.up=[];G.streak++;G.best=Math.max(G.best,G.streak);const fin=G.got.size===G.cs.length;renderMemory();
        rs.forEach(r=>FX.burst(r,22));FX.cheer(rs[1],FX.praise(G.streak));FX.play('good');rec(d=>bump(sub(d,'right'),a.o.w));
        ks.forEach(k=>{const e=$('memoryBody').querySelector(`[data-i="${k}"]`);if(e)e.classList.add('popin')});
        if(fin){const n=G.cs.length,lim=n*2;setTimeout(()=>roundEnd('memory',{score:n,total:n,pass:G.moves<=lim,top:plural(G.moves,'turn'),scoreText:plural(G.moves,'turn'),passText:`${lim} turns or fewer`,
          stars:G.moves<=n+3?3:G.moves<=lim?2:1,msg:G.moves<=lim?'You found them all!':'You found them all! Try for fewer turns next time.',
          extra:G.best>=3?`<p class="note" style="margin:0">Best streak: ${G.best} pairs in a row.</p>`:'',rec:(d,x)=>{bump(x,'turns',G.moves);x.fewest=Math.min(x.fewest||999,G.moves)}}),700)}}
      else{G.lock=true;G.streak=0;renderMemory();setTimeout(()=>FX.play('bad'),250);setTimeout(()=>{G.up=[];G.lock=false;renderMemory()},1100)}}
    else{FX.play('flip');renderMemory()}
  });
  fitMemTiles();
}
function fitMemTiles(){document.querySelectorAll('#memoryBody .tile2.up').forEach(t=>{t.style.fontSize='';t.style.overflowWrap='';let f=parseFloat(getComputedStyle(t).fontSize),n=0;const over=()=>t.scrollHeight>t.clientHeight+1||t.scrollWidth>t.clientWidth+1;
  while(over()&&f>9&&n++<30){f-=.5;t.style.fontSize=f+'px'}if(over())t.style.overflowWrap='anywhere'})}
addEventListener('resize',()=>{if(mode==='memory')fitMemTiles()});

/* ---------- Rhyme time ---------- */
let RH=null;
function startRhyme(){const rows=scopeWeeksWith('rhyme').flatMap(n=>WK(n).rhymes);if(!rows.length)return emptyAct('rhyme');
  RH={items:draw('rhyme',rows,Math.min(15,rows.length),r=>r[0]+'>'+r[2]).map(r=>({cue:r[0],opts:shuf(r[1]),ans:r[2],bad:[]})),i:0,score:0,missed:[],streak:0};renderRhyme()}
function renderRhyme(){const r=RH,q=r.items[r.i],n=r.items.length;

    <div class="sayrow"><p class="prompt">Which spelling word rhymes with <span class="r">${esc(q.cue)}</span>?</p>${sayBtn(q.cue,`Hear ${q.cue}`)}</div>
    <div class="opts three">${q.opts.map(x=>`<button class="opt spopt ${q.done&&x===q.ans?'right':''} ${q.bad.includes(x)?'wrong':''}" data-v="${esc(x)}" ${q.done||q.bad.includes(x)?'disabled':''}>${esc(x)}</button>`).join('')}</div>
    <div id="rhFb">${r.fb?`<div class="fb ${r.fbc}"><p>${r.fb}</p>${q.done?`<div class="grp"><button class="btn primary nextq" id="rhNext">${r.i===n-1?'See my score':'Next →'}</button></div>`:''}</div>`:''}</div></div>`;
  $('rhymeBody').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const x=b.dataset.v;
    if(x===q.ans){q.done=true;const first=!q.bad.length;if(first){r.score++;r.streak++}else r.streak=0;answer(q.ans,first);r.fb=`<b>${esc(q.cue)}</b> · <b>${esc(x)}</b>. They rhyme!`;r.fbc='ok';renderRhyme();
      const nb=$('rhymeBody').querySelector('.opt.right');FX.burst(nb,22);FX.cheer(nb,FX.praise(r.streak||1));FX.play('good');SPEAK.say(rhymeLine(q.cue,q.ans))}
    else{q.bad.push(x);r.fb=`<b>${esc(x)}</b> doesn't rhyme with <b>${esc(q.cue)}</b>. Say them both out loud.`;r.fbc='no';if(!r.missed.includes(q.ans))r.missed.push(q.ans);FX.play('bad');renderRhyme()}});
  const nb=$('rhNext');if(nb){nb.focus({preventScroll:true});nb.onclick=()=>{r.i++;r.fb='';if(r.i>=n)return roundEnd('rhyme',{score:r.score,total:n,pass:r.score>=Math.ceil(n*.8),missed:r.missed,passText:`${Math.ceil(n*.8)} of ${n}`});renderRhyme()}}
}

/* ---------- Sound sort: tap a word, then the sound and spelling it has ---------- */
let SO=null;
function startSort(){const ws=scopeWeeksWith('sort');if(!ws.length)return emptyAct('sort');const n=ws.includes(S.cur)?S.cur:ws[Math.floor(Math.random()*ws.length)];

/* ---------- ABC order ---------- */
let AB=null;
function startAbc(){const ws=scopeWeeksWith('abc');if(!ws.length)return emptyAct('abc','No words yet.');const sets=[];
  const sheetWeek=ws.find(n=>WK(n).abc.length);if(sheetWeek)sets.push({words:shuf(WK(sheetWeek).abc),dir:-1});
  const pool=shuf([...new Set(ws.flatMap(n=>WK(n).words.map(x=>x.w)))]);let k=0,guard=0;
  while(sets.length<3&&guard++<20){const pick=pool.slice(k,k+5);k+=5;if(pick.length<4){k=0;continue}sets.push({words:pick,dir:sets.length%2?1:-1})}
  AB={sets,si:0,picked:[],mist:0,score:0,flash:null,fb:''};renderAbc()}
function renderAbc(){const r=AB,set=r.sets[r.si],target=set.words.slice().sort((x,y)=>set.dir*x.localeCompare(y)),left=set.words.filter(x=>!r.picked.includes(x)),done=!left.length;
  $('abcBody').innerHTML=`<div class="wcard">${qtop(`Set ${r.si+1} of ${r.sets.length}`,r.si,r.sets.length,`★ ${r.score}`)}
    <p class="target">${set.dir<0?'Reverse ABC order: z to a':'ABC order: a to z'}</p>
    <p class="hintline">${done?(r.mist?'Done!':'Perfect order!'):`Tap the word that comes ${r.picked.length?'next':'first'}.`}</p>
    <ol class="slots abcslots ${done?'ok':''}" aria-label="Your order">${r.picked.length?r.picked.map(x=>`<li class="tile c-free"><b>${esc(x)}</b></li>`).join(''):`<li class="ph">${set.dir<0?'z … a':'a … z'}</li>`}</ol>
    ${r.fb?`<p class="bfb no">${esc(r.fb)}</p>`:''}
    <div class="tray">${left.map(x=>`<button class="tile c-free ${r.flash===x?'shake':''}" data-v="${esc(x)}"><b>${esc(x)}</b></button>`).join('')}</div>
    ${done?`<div class="controls" style="justify-content:center"><button class="btn primary nextq" id="abNext">${r.si+1<r.sets.length?'Next set →':'See my score'}</button></div>`:''}</div>`;
  $('abcBody').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const x=b.dataset.v;
    if(x===target[r.picked.length]){r.picked.push(x);r.flash=null;r.fb='';const fin=r.picked.length===target.length;renderAbc();if(fin){const s=$('abcBody').querySelector('.abcslots');if(!r.mist){FX.burst(s,30);FX.cheer(s,FX.praise(0))}FX.play('good');s.classList.add('popin');const nb=$('abNext');if(nb)nb.focus({preventScroll:true})}else FX.play('flip')}
    else{r.mist++;r.flash=x;r.fb=`Look at the ${firstDiff(x,target[r.picked.length])} letter of each word.`;FX.play('bad');renderAbc()}});
  const nb=$('abNext');if(nb)nb.onclick=()=>{if(!r.mist)r.score++;r.si++;r.picked=[];r.mist=0;r.fb='';r.flash=null;
    if(r.si>=r.sets.length)return roundEnd('abc',{score:r.score,total:r.sets.length,pass:r.score>=2,missed:[],passText:'2 of 3 sets in perfect order',rec:(d,x)=>{if(r.score===r.sets.length)bump(x,'perfect')}});renderAbc()};
}
function firstDiff(a,b){let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;return["first","second","third","fourth","fifth","sixth"][i]||"next"}

/* ---------- Proofread: find the misspelled words and fix them (3 tries, then the answer) ---------- */
let PR=null;
function parseProof(text){let id=0;
  return text.split(/\n\s*\n/).map(p=>{const out=[];
    p.split(/(\[[^\]]+\])/).forEach(part=>{const m=part.match(/^\[([^|\]]+)\|([^\]]+)\]$/);
      if(m){out.push({id:id++,tap:true,text:m[1],right:m[2]});return}
      part.split(/(\s+)/).forEach(seg=>{if(!seg)return;const mm=seg.match(/^([^A-Za-z']*)([A-Za-z']+)([^A-Za-z']*)$/);
        if(mm){if(mm[1])out.push({text:mm[1]});out.push({id:id++,tap:true,text:mm[2]});if(mm[3])out.push({text:mm[3]})}else out.push({text:seg})})});

/* a different passage each time: go through all of a week's passages, in a shuffled order, before any repeats */
function pickProof(n){const all=WK(n).proof,k='sc-proof-seen-'+n;let seen=(store.get(k,null)||[]).filter(i=>i<all.length);

  $('proofBody').innerHTML=`<div class="wcard">${qtop(`${nFixed} of ${errs.length} fixed · week ${r.week}`,nFixed,errs.length,r.wrongTaps?plural(r.wrongTaps,'wrong tap'):'')}

    <div class="passage">${r.paras.map(p=>`<p>${p.map(t=>t.tap?`<button class="pw ${r.fixed[t.id]?'fixed':(r.open===t.id?'found':'')} ${r.nope===t.id?'nope':''}" data-t="${t.id}" ${r.fixed[t.id]?'aria-disabled="true"':''}>${esc(r.fixed[t.id]?t.right:t.text)}</button>`:esc(t.text)).join('')}</p>`).join('')}</div>
    ${open?`<form class="spform" id="prForm" autocomplete="off"><label for="prIn" class="note">Write <b class="bad-word">${esc(open.text)}</b> correctly${r.tries?` (try ${r.tries+1} of 3)`:''}:</label>

    <div class="fixlist">${errs.map((t,k)=>`<span class="${r.fixed[t.id]?'on':''}"><i>${k+1}</i>${r.fixed[t.id]?esc(t.right):''}</span>`).join('')}</div>
    ${nFixed===errs.length?`<div class="controls" style="justify-content:center"><button class="btn primary nextq" id="prDone">See my score</button></div>`:''}</div>`;
  $('proofBody').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const id=+b.dataset.t,tok=toks.find(x=>x.id===id);if(r.fixed[id])return;
    if(tok.right){r.open=id;r.tries=0;r.fb='';r.nope=null;renderProof();const i=$('prIn');if(i&&SPELL_KB.matches)i.focus();else if(i)i.scrollIntoView({block:'nearest'})}
    else{r.wrongTaps++;r.nope=id;r.open=null;r.fb=`“${tok.text}” is spelled correctly.`;r.fbc='no';FX.play('bad');renderProof()}});
  const f=$('prForm');if(f)f.onsubmit=e=>{e.preventDefault();const tok=toks.find(x=>x.id===r.open),v=norm($('prIn').value);if(!v)return;

      if(r.tries>=3){r.fixed[tok.id]=true;answer(tok.right,false);r.open=null;r.fb=`It's spelled ${tok.right}.`;r.fbc='no';renderProof()}

function badgeVals(){

  v.days=all.filter(activeDay).length;v.run=bestRun(days);v.min=Math.round(all.reduce((s,d)=>s+(d.min||0),0));v.name=HIST.name?1:0;

  v.built=sumAct('build','r');v.rhymePerfect=all.some(d=>((d.act||{}).rhyme||{}).best>=15)?1:0;v.sortPerfect=sumAct('sort','perfect');v.abcPerfect=sumAct('abc','perfect');v.proofPerfect=sumAct('proof','perfect');
  v.matchPerfect=sumAct('match','perfect');v.matchFast=minAct('match','fast');v.memFew=minAct('memory','fewest');v.speedBest=maxAct('speed','best');
  {const k=new Set();all.forEach(d=>{for(const a in d.act||{})if(d.act[a].p&&ACTS[a])k.add(a)});v.kinds=k.size}
  v.hat=Object.keys(ACTS).some(a=>WEEKS.some(W=>passCount(a,W.n)>=3))?1:0;
  {const {f,b}=fcSides();v.both=[...f].filter(i=>b.has(i)).length;v.fcWeeks=WEEKS.filter(W=>W.words.length&&fcGate(W.n).ok).length}
  v.mastered=Object.keys(st).filter(w=>isMastered(st[w])).length;

  v.pre=Object.values(th).filter(h=>h.pre).length;v.fin=Object.values(th).filter(h=>h.fin).length;

  both25:['🔄','25'],both100:['🗂️','100'],known10:['✔️','10'],mast10:['🌱','10'],mast50:['🌳','50'],mast200:['🏰','200'],week:['🎁']};
function medal(b,on,small){const sh=BSHAPE[b.cat]||BSHAPE.quiz,cy=b.cat==='start'?33:30,[emo,tag]=BEMO[b.id]||['★'],hasTag=tag&&!small,ey=hasTag?cy-4:cy+1,tw=tag?Math.max(16,[...tag].length*6.2+8):0;
  const inner=`<g transform="translate(32 ${cy}) scale(.76) translate(-32 -${cy})">${sh} class="bring"/></g>`;
  const rib=on&&!small?`<path class="brib" d="M21 40 14 62l7-4 4 5 6-19z"/><path class="brib" d="M43 40l7 22-7-4-4 5-6-19z"/>`:'';
  const lock=on||small?'':`<g class="block"><circle cx="53" cy="12" r="9"/><rect x="48.8" y="11.2" width="8.4" height="6.4" rx="1.4"/><path d="M50.7 11.2V9a2.3 2.3 0 0 1 4.6 0v2.2"/></g>`;
  const glint=on?`<ellipse class="bglint" cx="24" cy="${cy-12}" rx="8" ry="3.5" transform="rotate(-35 24 ${cy-12})"/>`:'';
  return`<span class="medal ${on?'on':''} ${small?'sm':''}" aria-hidden="true"><svg viewBox="0 0 64 66">${rib}${on?`<g transform="translate(0 2.5)">${sh} class="bshadow"/></g>`:''}${sh} class="bs" ${on?`style="fill:url(#bg-${b.cat})"`:''}/>${inner}${glint}<text x="32" y="${ey}" class="be" font-size="${small?30:hasTag?22:26}">${emo}</text>${hasTag?`<g class="btag"><rect x="${32-tw/2}" y="${cy+8.5}" width="${tw}" height="12" rx="6"/><text x="32" y="${cy+14.8}">${esc(tag)}</text></g>`:''}${lock}</svg></span>`}
function badgesHTML(){
  const {v,ids}=earnedBadges(),got=new Set(ids),cats=[...new Set(BADGES.map(b=>b.cat))];
  return`<section class="sblock"><div class="gtop"><p class="plabel" style="margin:0">Badges</p><span class="note"><b>${ids.length}</b> of ${BADGES.length} earned</span></div>
    ${cats.map(c=>`<p class="bcat">${BCAT[c]}</p><div class="bgrid">${BADGES.filter(b=>b.cat===c).map(b=>{const on=got.has(b.id),val=b.val(v);
      const prog=on?'Earned':b.best?(val?`Best so far: ${val}`:'Not yet'):`${Math.min(val,b.n)} / ${b.n}`;
      const p=on?100:Math.round(100*Math.min(val,b.n)/b.n);
      return`<div class="badge ${on?'on':''}" title="${esc(b.desc)}">${medal(b,on)}<b>${esc(b.name)}</b><small>${esc(b.desc)}</small>${on?'<em>Earned!</em>':`<div class="bprog"><i style="width:${p}%"></i></div><small class="bp">${esc(prog)}</small>`}</div>`}).join('')}</div>`).join('')}
  </section>`;
}
/* new-badge toast */
let BSEEN=new Set(store.get('sc-badges-seen',null)||[]);
if(!store.get('sc-badges-init',false)){earnedBadges().ids.forEach(i=>BSEEN.add(i));store.set('sc-badges-seen',[...BSEEN]);store.set('sc-badges-init',true)}
let badgeTimer=null,badgeQueue=[],badgeShowing=false;
function checkBadges(){clearTimeout(badgeTimer);badgeTimer=setTimeout(()=>{
  const {ids}=earnedBadges(),fresh=ids.filter(i=>!BSEEN.has(i));if(!fresh.length)return;
  fresh.forEach(i=>BSEEN.add(i));store.set('sc-badges-seen',[...BSEEN]);badgeQueue.push(...fresh);showNextBadge()},900)}
function showNextBadge(){if(badgeShowing||!badgeQueue.length)return;badgeShowing=true;
  const id=badgeQueue.shift(),b=BADGES.find(x=>x.id===id);if(!b){badgeShowing=false;return}const t=$('badgeToast');
  t.innerHTML=`${medal(b,true)}<div><small>New badge!</small><b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div><button class="btn small" id="badgeSee">See badges</button>`;
  t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');
  FX.shower();FX.play('win');
  $('badgeSee').onclick=()=>{t.hidden=true;badgeShowing=false;badgeQueue=[];setMode('progress');setTimeout(()=>{const s=$('badgeSec');if(s)s.scrollIntoView({block:'start'})},50)};
  clearTimeout(t._t);t._t=setTimeout(()=>{t.hidden=true;badgeShowing=false;showNextBadge()},4200)}

/* ---------- Name ---------- */
let editingName=false;
function setName(n){editingName=false;HIST.name=String(n||'').trim().slice(0,40);saveLocal();renderNameBar();checkBadges();if(mode==='home')renderHome()}
function renderNameBar(){const nb=$('namebar');
  nb.hidden=!!HIST.name&&!editingName;nb.classList.toggle('editing',editingName);
  const run=currentRun(HIST.days);
  $('whoami').innerHTML=HIST.name?`<button type="button" class="whochip" id="whoChip" aria-label="Signed in as ${esc(HIST.name)}. Change name"><span class="wave">👋</span><span class="wn">${esc(HIST.name)}</span>${run?`<span class="wst">🔥 ${run}</span>`:''}<span class="ed">✎</span></button>`:'';
  const wc=$('whoChip');if(wc)wc.onclick=()=>{editingName=!editingName;renderNameBar();if(editingName){const i=$('nameInput');i.value=HIST.name;i.focus();i.select()}};
}
$('nameSave').onclick=()=>setName($('nameInput').value);
$('nameInput').onkeydown=e=>{if(e.key==='Enter')setName($('nameInput').value)};

/* ---------- Boot ---------- */
renderNameBar();checkBadges();
{const h=(location.hash||'').replace(/^#\/?/,'');setMode(MODES.includes(h)?h:'home');scrollTo(0,0)}
addEventListener('hashchange',()=>{const h=(location.hash||'').replace(/^#\/?/,'');if(MODES.includes(h)&&h!==mode){setMode(h);scrollTo(0,0)}});
</script>
</body>
